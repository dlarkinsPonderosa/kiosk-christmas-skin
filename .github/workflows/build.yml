name: Build
# Every push builds a ZIP for testing with Install from ZIP. Releases use release.yml.
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build
        run: python3 tools/build.py --android-platform 35
      - uses: actions/upload-artifact@v4
        with:
          name: christmas-lights-and-snowman
          path: dist/christmas-lights-snowman-voice-skin-*.zip
